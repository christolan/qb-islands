<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>qBittorrent Islands</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 272px;
      margin: 0;
      padding: 16px;
      background: #f7f8fa;
      color: #1f2329;
      font: 13px/1.45 "JetBrains Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 3px; font-size: 15px; letter-spacing: -.1px; }
    h1 img { width: 18px; height: 18px; }
    .sub { margin-bottom: 14px; color: #6b7280; font-size: 11.5px; }
    .modes { display: flex; flex-direction: column; gap: 7px; }
    .mode {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 11px;
      border: 1px solid #dfe1e6;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(31,35,41,.04);
      cursor: pointer;
      transition: background .12s, border-color .12s, box-shadow .12s;
    }
    .mode:hover { border-color: #b9c9ec; background: #f8faff; }
    .mode input { width: 15px; height: 15px; margin: 0; accent-color: #3574f0; cursor: pointer; }
    .mode .swatch { flex: none; width: 26px; height: 26px; border: 1px solid #d5d9e0; border-radius: 6px; }
    .mode main { flex: 1; }
    .mode .label { font-weight: 600; }
    .mode .desc { margin-top: 1px; color: #737985; font-size: 11px; }
    .mode.on { border-color: #3574f0; background: #f4f8ff; box-shadow: 0 0 0 2px rgba(53,116,240,.14); }
    footer { margin-top: 14px; padding-top: 9px; border-top: 1px solid #e8eaef; color: #737985; font-size: 10.5px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1><img src="../../icons/icon32.png" alt="" />qBittorrent Islands</h1>
  <div class="sub">islands 卡片设计 · JetBrains IDE 风格</div>

  <div class="modes" id="modes">
    <label class="mode" data-mode="on">
      <input type="radio" name="mode" value="on" />
      <span class="swatch" style="background:linear-gradient(135deg,#fff 0 48%,#dbeafe 48% 100%)"></span>
      <main>
        <div class="label">启用 Islands</div>
        <div class="desc">浅色卡片与紧凑的信息层级</div>
      </main>
    </label>
    <label class="mode" data-mode="off">
      <input type="radio" name="mode" value="off" />
      <span class="swatch" style="background:repeating-linear-gradient(45deg,#e2e5ea,#e2e5ea 4px,#f6f7f9 4px,#f6f7f9 8px)"></span>
      <main>
        <div class="label">关闭</div>
        <div class="desc">还原 qBittorrent 原生外观</div>
      </main>
    </label>
  </div>

  <footer>切换后立即生效，无需刷新页面。仅覆盖原有页面元素样式，只作用于 qBittorrent 页面。</footer>
  <script src="popup.js"></script>
</body>
</html>
